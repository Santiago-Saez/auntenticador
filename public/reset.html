<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Reset</title></head>
<body><h1>Elegir nueva contraseña</h1>
<form id="f"><input name="newPassword" type="password" placeholder="nueva (mín. 12)" required><button>Guardar</button></form>
<pre id="o"></pre>
<script>document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const token = new URLSearchParams(location.search).get('token');
  const newPassword = new FormData(e.target).get('newPassword');
  const r = await fetch('/api/reset', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ token, newPassword }) });
  document.getElementById('o').textContent = JSON.stringify(await r.json(), null, 2);
});</script></body></html>
